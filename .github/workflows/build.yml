name: Build Real D-Pad APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source
        run: git clone https://github.com/ManmeetSingh122/D-PadOverlay.git source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Modify D-pad controls
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/tvremote/overlay/RemoteAccessibilityService.kt")
          s = p.read_text()

          s = s.replace(
              """fun navigate(direction: Int) {
            instance?.doNavigate(direction)
        }""",
              """fun navigate(direction: Int) {
            val service = instance ?: return
            when (direction) {
                View.FOCUS_UP -> service.performGlobalAction(GLOBAL_ACTION_DPAD_UP)
                View.FOCUS_DOWN -> service.performGlobalAction(GLOBAL_ACTION_DPAD_DOWN)
                View.FOCUS_LEFT -> service.performGlobalAction(GLOBAL_ACTION_DPAD_LEFT)
                View.FOCUS_RIGHT -> service.performGlobalAction(GLOBAL_ACTION_DPAD_RIGHT)
            }
        }"""
          )

          s = s.replace(
              """fun performClick() {
            instance?.doClick()
        }""",
              """fun performClick() {
            instance?.performGlobalAction(GLOBAL_ACTION_DPAD_CENTER)
        }"""
          )

          p.write_text(s)
          print("D-pad modification complete")
          PY

      - name: Build APK
        working-directory: source
        run: |
          gradle --version
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVRemoteOverlay-Real-DPad
          path: source/app/build/outputs/apk/debug/app-debug.apk
