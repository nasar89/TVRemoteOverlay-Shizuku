name: Build Real D-Pad APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source
        run: git clone https://github.com/ManmeetSingh122/D-PadOverlay.git source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          /opt/gradle-8.2/bin/gradle -p source wrapper --gradle-version=8.2
          chmod +x source/gradlew

      - name: Fix D-Pad controls
        run: |
          sed -i 's#            instance?\.doNavigate(direction)#            instance?.let { service -> when (direction) { View.FOCUS_UP -> service.performGlobalAction(GLOBAL_ACTION_DPAD_UP); View.FOCUS_DOWN -> service.performGlobalAction(GLOBAL_ACTION_DPAD_DOWN); View.FOCUS_LEFT -> service.performGlobalAction(GLOBAL_ACTION_DPAD_LEFT); View.FOCUS_RIGHT -> service.performGlobalAction(GLOBAL_ACTION_DPAD_RIGHT); else -> service.doNavigate(direction) } }#' source/app/src/main/java/com/tvremote/overlay/RemoteAccessibilityService.kt
          sed -i 's#            instance?\.doClick()#            instance?.performGlobalAction(GLOBAL_ACTION_DPAD_CENTER)#' source/app/src/main/java/com/tvremote/overlay/RemoteAccessibilityService.kt

      - name: Build APK
        working-directory: source
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Remote-Real-DPad-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
