name: Build Real D-Pad APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source
        run: git clone https://github.com/ManmeetSingh122/D-PadOverlay.git source

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          /opt/gradle-8.2/bin/gradle -p source wrapper --gradle-version=8.2
          chmod +x source/gradlew

      - name: Replace Accessibility Service
        run: |
          cat > source/app/src/main/java/com/tvremote/overlay/RemoteAccessibilityService.kt <<'KOTLIN'
          package com.tvremote.overlay

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.AccessibilityServiceInfo
          import android.view.View
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class RemoteAccessibilityService : AccessibilityService() {

              companion object {
                  private var instance: RemoteAccessibilityService? = null

                  fun navigate(direction: Int) {
                      val service = instance ?: return

                      when (direction) {
                          View.FOCUS_UP ->
                              service.performGlobalAction(GLOBAL_ACTION_DPAD_UP)

                          View.FOCUS_DOWN ->
                              service.performGlobalAction(GLOBAL_ACTION_DPAD_DOWN)

                          View.FOCUS_LEFT ->
                              service.performGlobalAction(GLOBAL_ACTION_DPAD_LEFT)

                          View.FOCUS_RIGHT ->
                              service.performGlobalAction(GLOBAL_ACTION_DPAD_RIGHT)
                      }
                  }

                  fun performClick() {
                      instance?.performGlobalAction(GLOBAL_ACTION_DPAD_CENTER)
                  }

                  fun performBack() {
                      instance?.performGlobalAction(GLOBAL_ACTION_BACK)
                  }

                  fun performHome() {
                      instance?.performGlobalAction(GLOBAL_ACTION_HOME)
                  }

                  fun performMenu() {
                      instance?.performGlobalAction(GLOBAL_ACTION_RECENTS)
                  }

                  fun isConnected(): Boolean = instance != null
              }

              override fun onServiceConnected() {
                  instance = this

                  serviceInfo = serviceInfo?.apply {
                      flags = flags or
                              AccessibilityServiceInfo.FLAG_RETRIEVE_INTERACTIVE_WINDOWS or
                              AccessibilityServiceInfo.FLAG_REQUEST_ENHANCED_WEB_ACCESSIBILITY
                  }
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
              }

              override fun onInterrupt() {
              }

              override fun onDestroy() {
                  super.onDestroy()
                  instance = null
              }
          }
          KOTLIN

      - name: Verify Real D-Pad code
        run: |
          grep -q "GLOBAL_ACTION_DPAD_UP" source/app/src/main/java/com/tvremote/overlay/RemoteAccessibilityService.kt
          grep -q "GLOBAL_ACTION_DPAD_DOWN" source/app/src/main/java/com/tvremote/overlay/RemoteAccessibilityService.kt
          grep -q "GLOBAL_ACTION_DPAD_LEFT" source/app/src/main/java/com/tvremote/overlay/RemoteAccessibilityService.kt
          grep -q "GLOBAL_ACTION_DPAD_RIGHT" source/app/src/main/java/com/tvremote/overlay/RemoteAccessibilityService.kt
          grep -q "GLOBAL_ACTION_DPAD_CENTER" source/app/src/main/java/com/tvremote/overlay/RemoteAccessibilityService.kt
          echo "REAL DPAD CODE VERIFIED"

      - name: Build APK
        working-directory: source
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Remote-REAL-DPAD-FIXED
          path: source/app/build/outputs/apk/debug/app-debug.apko
