name: Build Real D-Pad APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source
        run: git clone https://github.com/ManmeetSingh122/D-PadOverlay.git source

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          /opt/gradle-8.2/bin/gradle -p source wrapper --gradle-version=8.2
          chmod +x source/gradlew

      - name: Verify D-Pad fix
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("source/app/src/main/java/com/tvremote/overlay/RemoteAccessibilityService.kt")
          s = p.read_text()

          old = """    fun navigate(direction: Int) {
              instance?.doNavigate(direction)
          }"""

          new = """    fun navigate(direction: Int) {
              val service = instance ?: return
              when (direction) {
                  View.FOCUS_UP -> service.performGlobalAction(GLOBAL_ACTION_DPAD_UP)
                  View.FOCUS_DOWN -> service.performGlobalAction(GLOBAL_ACTION_DPAD_DOWN)
                  View.FOCUS_LEFT -> service.performGlobalAction(GLOBAL_ACTION_DPAD_LEFT)
                  View.FOCUS_RIGHT -> service.performGlobalAction(GLOBAL_ACTION_DPAD_RIGHT)
                  else -> service.doNavigate(direction)
              }
          }"""

          if old not in s:
              raise SystemExit("ERROR: Navigation code was not found. Build stopped.")

          s = s.replace(old, new)

          old_click = """    fun performClick() {
              instance?.doClick()
          }"""

          new_click = """    fun performClick() {
              instance?.performGlobalAction(GLOBAL_ACTION_DPAD_CENTER)
          }"""

          if old_click not in s:
              raise SystemExit("ERROR: OK button code was not found. Build stopped.")

          s = s.replace(old_click, new_click)

          p.write_text(s)

          print("REAL DPAD FIX APPLIED")
          PY

      - name: Verify D-Pad fix
        run: |
          grep -q "GLOBAL_ACTION_DPAD_UP" source/app/src/main/java/com/tvremote/overlay/RemoteAccessibilityService.kt
          grep -q "GLOBAL_ACTION_DPAD_DOWN" source/app/src/main/java/com/tvremote/overlay/RemoteAccessibilityService.kt
          grep -q "GLOBAL_ACTION_DPAD_LEFT" source/app/src/main/java/com/tvremote/overlay/RemoteAccessibilityService.kt
          grep -q "GLOBAL_ACTION_DPAD_RIGHT" source/app/src/main/java/com/tvremote/overlay/RemoteAccessibilityService.kt
          grep -q "GLOBAL_ACTION_DPAD_CENTER" source/app/src/main/java/com/tvremote/overlay/RemoteAccessibilityService.kt
          echo "ALL 5 REAL DPAD ACTIONS VERIFIED"

      - name: Build APK
        working-directory: source
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Remote-Real-DPad-FIXED
          path: source/app/build/outputs/apk/debug/app-debug.apk
